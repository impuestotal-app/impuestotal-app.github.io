  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 18px; background: #f5f7fa; font: 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #5b6b7e;
           transition: opacity .35s; z-index: 2; }

  #carga b span { color: #1f8a80; }
  .barra { width: 160px; height: 4px; border-radius: 2px; background: #d6dde7; overflow: hidden; }
  .barra i { display: block; width: 40%; height: 100%; background: #1d5fa8; animation: mover 1.1s ease-in-out infinite; }
  @keyframes mover { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

<iframe id="app" title="IMPUESTOTAL" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  /* Dirección de la aplicación web de Apps Script (termina en /exec). */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzwGpRJ2iSvgtF4r8Kg4u3xb2vSz5kDL6KCGqwDaOvpY99FrTKYYI09eunpgAKPw-xXHg/exec';

  f.addEventListener('load', function () { document.getElementById('carga').classList.add('oculto'); });

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
